{% extends "base.html" %}
{% block title %}Password reset complete | proIT{% endblock %}
{% block content %}
<section class="card password-card">
    <div class="password-card-icon password-success-icon">
        <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="38" height="38" rx="11" fill="#e7f8f1"/>
            <path d="M16 24L20 28L30 18" stroke="#1fa776" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="20" cy="20" r="5" fill="#1fa776"/>
        </svg>
    </div>
    <h1>Password reset complete</h1>
    <p>Your password has been set. You can now sign in.</p>
    <a class="button" href="{% url 'login' %}">Sign in</a>
</section>
{% endblock %}
