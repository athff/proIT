{% extends "base.html" %}
{% block title %}Delete {{ record }} | proIT{% endblock %}
{% block content %}<section class="people-heading"><div><div class="eyebrow">Confirm action</div><h1>Delete {{ record }}?</h1><p class="subtle">This will permanently remove this {{ singular }} record.</p></div></section><section class="panel"><p>Are you sure you want to delete <strong>{{ record }}</strong>?</p><form method="post" class="form-actions">{% csrf_token %}<button class="danger-button" type="submit">Delete record</button><a class="secondary-button" href="{% url 'people:detail' resource record.pk %}">Cancel</a></form></section>{% endblock %}
