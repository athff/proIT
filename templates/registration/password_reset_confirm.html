{% extends "base.html" %}
{% block title %}Choose a new password | proIT{% endblock %}
{% block content %}
<section class="card">
    <h1>Choose a new password</h1>
    {% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Set password</button>
    </form>
    {% else %}
    <p class="errors">This password reset link is invalid or has expired.</p>
    <a href="{% url 'password_reset' %}">Request a new link</a>
    {% endif %}
</section>
{% endblock %}
