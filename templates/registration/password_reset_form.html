{% extends "base.html" %}
{% block title %}Reset password | proIT{% endblock %}
{% block content %}
<section class="card">
    <h1>Reset your password</h1>
    <p class="muted">Enter your email address and we will send reset instructions if an account matches.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send reset link</button>
    </form>
</section>
{% endblock %}
