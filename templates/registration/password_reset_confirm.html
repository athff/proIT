{% extends "base.html" %}
{% block title %}Choose a new password | proIT{% endblock %}
{% block content %}
<section class="card password-card">
    <div class="password-card-icon">
        <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="38" height="38" rx="11" fill="#eaf1ff"/>
            <path d="M14 22L18 26L30 14" stroke="#2f6fed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="18" cy="18" r="5" fill="#2f6fed"/>
        </svg>
    </div>
    <h1>Choose a new password</h1>
    {% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="password-submit">Set password</button>
    </form>
    {% else %}
    <p class="errors">This password reset link is invalid or has expired.</p>
    <a href="{% url 'password_reset' %}" class="button">Request a new link</a>
    {% endif %}
</section>
{% endblock %}
