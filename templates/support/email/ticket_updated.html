<!doctype html><html><body style="margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#17233f"><div style="max-width:620px;margin:30px auto;background:#fff;border:1px solid #e3e9f2;border-radius:12px;overflow:hidden"><div style="padding:24px;background:#1a2746;color:#fff"><h1 style="margin:0;font-size:20px">Ticket status updated</h1></div><div style="padding:26px"><p>Hello {{ ticket.requester.get_full_name|default:ticket.requester.get_username }},</p><p>Ticket <strong>{{ ticket.reference }}</strong> is now <strong>{{ ticket.get_status_display }}</strong>.</p>{% if ticket.resolution %}<div style="padding:15px;border-radius:9px;background:#f1fbf7"><strong>Resolution</strong><p style="margin-bottom:0">{{ ticket.resolution }}</p></div>{% endif %}<p style="margin-top:22px"><a href="{{ ticket_url }}" style="display:inline-block;padding:11px 17px;border-radius:7px;background:#2f6fed;color:#fff;text-decoration:none;font-weight:bold">View ticket</a></p></div></div></body></html>
