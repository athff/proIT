{% extends "base.html" %}
{% block title %}Check your email | proIT{% endblock %}
{% block content %}
<section class="card password-card">
    <div class="password-card-icon">
        <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="18" cy="18" r="18" fill="#eaf1ff"/>
            <path d="M14 22L18 26L30 14" stroke="#1fa776" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="18" cy="18" r="5" fill="#1fa776"/>
        </svg>
    </div>
    <h1>Check your email</h1>
    <p>If an account matches that address, password reset instructions have been sent.</p>
    <a href="{% url 'login' %}" class="button">Return to sign in</a>
</section>
{% endblock %}
