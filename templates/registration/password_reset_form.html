{% extends "base.html" %}
{% block title %}Reset password | proIT{% endblock %}
{% block content %}
<section class="card password-card">
    <div class="password-card-icon">
        <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="38" height="38" rx="11" fill="#eaf1ff"/>
            <path d="M14 22L18 26L30 14" stroke="#2f6fed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="18" cy="18" r="5" fill="#2f6fed"/>
        </svg>
    </div>
    <h1>Reset your password</h1>
    <p class="muted">Enter your email address and we will send reset instructions if an account matches.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="password-submit">Send reset link</button>
    </form>
</section>
{% endblock %}
